<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CNS Skills — From draft to defensible manuscript</title>
  <desc id="desc">A dark navy and teal banner for CNS Skills, an evidence-first scientific-writing workflow for ChatGPT, Codex, Claude, and Agent Skills clients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.58" stop-color="#0B2840"/>
      <stop offset="1" stop-color="#0B5B59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D486"/>
      <stop offset="1" stop-color="#E9B44C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35B5AD" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#35B5AD" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02070D" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1050" cy="250" r="330" fill="url(#glow)"/>
  <g opacity="0.08" stroke="#D6F3EF" stroke-width="1">
    <path d="M0 96H1280M0 192H1280M0 288H1280M0 384H1280M0 480H1280M0 576H1280"/>
    <path d="M96 0V640M192 0V640M288 0V640M384 0V640M480 0V640M576 0V640M672 0V640M768 0V640M864 0V640M960 0V640M1056 0V640M1152 0V640"/>
  </g>

  <g transform="translate(72 54)">
    <rect x="0" y="0" width="358" height="34" rx="17" fill="#E9B44C" fill-opacity="0.14" stroke="#E9B44C" stroke-opacity="0.65"/>
    <text x="18" y="23" fill="#F5D486" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">INDEPENDENT · OPEN SOURCE · MIT</text>

    <text x="0" y="150" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="3">CNS SKILLS</text>
    <rect x="2" y="172" width="126" height="7" rx="3.5" fill="url(#gold)"/>

    <text x="0" y="239" fill="#D9F2EF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="1.1">FROM DRAFT TO DEFENSIBLE MANUSCRIPT.</text>
    <text x="0" y="286" fill="#B9CFD9" font-family="Arial, Helvetica, sans-serif" font-size="21">Evidence-first manuscript engineering for top journals</text>
    <text x="0" y="318" fill="#B9CFD9" font-family="Arial, Helvetica, sans-serif" font-size="21">and conferences — English-first, bilingual, auditable.</text>

    <g transform="translate(0 374)" font-family="Arial, Helvetica, sans-serif">
      <g>
        <text x="0" y="0" fill="#F5D486" font-size="29" font-weight="800">12</text>
        <text x="0" y="25" fill="#AAC3CD" font-size="13" font-weight="700" letter-spacing="1.2">EDITORIAL GATES</text>
      </g>
      <g transform="translate(166 0)">
        <text x="0" y="0" fill="#F5D486" font-size="29" font-weight="800">8</text>
        <text x="0" y="25" fill="#AAC3CD" font-size="13" font-weight="700" letter-spacing="1.2">VENUE PROFILES</text>
      </g>
      <g transform="translate(326 0)">
        <text x="0" y="0" fill="#F5D486" font-size="25" font-weight="800">EN / ZH</text>
        <text x="0" y="25" fill="#AAC3CD" font-size="13" font-weight="700" letter-spacing="1.2">BILINGUAL WORKFLOW</text>
      </g>
      <g transform="translate(548 0)">
        <text x="0" y="0" fill="#F5D486" font-size="25" font-weight="800">LOCAL</text>
        <text x="0" y="25" fill="#AAC3CD" font-size="13" font-weight="700" letter-spacing="1.2">TRANSPARENT QA</text>
      </g>
    </g>

    <text x="0" y="508" fill="#7694A1" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.1">CNS = CELL · NATURE · SCIENCE — AN ASPIRATIONAL EDITORIAL BENCHMARK</text>
  </g>

  <g transform="translate(790 92)" filter="url(#shadow)">
    <rect width="418" height="448" rx="34" fill="#F7FAF9"/>
    <rect width="418" height="92" rx="34" fill="#113955"/>
    <path d="M0 58H418V92H0Z" fill="#113955"/>
    <rect x="28" y="27" width="44" height="44" rx="11" fill="#E9B44C"/>
    <path d="M40 49l8 8 15-18" fill="none" stroke="#113955" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="55" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">THE 12-GATE EDITORIAL SYSTEM</text>

    <g transform="translate(34 126)" font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(0 0)">
        <circle cx="13" cy="13" r="13" fill="#0B6E69"/>
        <path d="M7 13l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="19" fill="#123B5D" font-size="18" font-weight="700">Claim &amp; significance</text>
      </g>
      <g transform="translate(0 58)">
        <circle cx="13" cy="13" r="13" fill="#0B6E69"/>
        <path d="M7 13l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="19" fill="#123B5D" font-size="18" font-weight="700">Evidence &amp; citation integrity</text>
      </g>
      <g transform="translate(0 116)">
        <circle cx="13" cy="13" r="13" fill="#0B6E69"/>
        <path d="M7 13l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="19" fill="#123B5D" font-size="18" font-weight="700">Natural academic English</text>
      </g>
      <g transform="translate(0 174)">
        <circle cx="13" cy="13" r="13" fill="#0B6E69"/>
        <path d="M7 13l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="19" fill="#123B5D" font-size="18" font-weight="700">Figures, tables &amp; captions</text>
      </g>
      <g transform="translate(0 232)">
        <circle cx="13" cy="13" r="13" fill="#0B6E69"/>
        <path d="M7 13l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="19" fill="#123B5D" font-size="18" font-weight="700">Reviewer defense &amp; file QA</text>
      </g>
    </g>

    <rect x="34" y="394" width="350" height="1" fill="#D5E2E4"/>
    <text x="34" y="422" fill="#55727F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.05">CHATGPT / CODEX · CLAUDE · AGENT SKILLS</text>
  </g>
</svg>
