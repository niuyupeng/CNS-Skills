<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CNS Skills — Make every claim earn its place</title>
  <desc id="desc">Social preview for the independent evidence-first manuscript engineering project CNS Skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.58" stop-color="#0B2B3F"/>
      <stop offset="1" stop-color="#075954"/>
    </linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#86D7CF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7C857"/>
      <stop offset="1" stop-color="#E9A93A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="80" r="280" fill="#179C8F" opacity="0.08"/>
  <circle cx="1200" cy="590" r="310" fill="#0CC0B0" opacity="0.07"/>

  <g transform="translate(72 54)" font-family="Arial, Helvetica, sans-serif">
    <rect width="512" height="38" rx="19" fill="#0D2535" stroke="#E9B44C" stroke-opacity="0.75"/>
    <text x="256" y="25" text-anchor="middle" fill="#FFD36A" font-size="15" font-weight="700" letter-spacing="1.8">INDEPENDENT · OPEN SOURCE · MIT</text>

    <text x="0" y="208" fill="#FFFFFF" font-size="88" font-weight="800" letter-spacing="5">CNS SKILLS</text>
    <rect x="2" y="230" width="126" height="7" rx="3.5" fill="url(#gold)"/>

    <text x="0" y="314" fill="#FFFFFF" font-size="31" font-weight="800" letter-spacing="0.7">MAKE EVERY CLAIM EARN ITS PLACE.</text>
    <text x="0" y="365" fill="#BCE1E2" font-size="23">Evidence-first manuscript engineering for top journals and conferences.</text>

    <g transform="translate(0 420)">
      <rect width="1136" height="76" rx="18" fill="#F6FAF9"/>
      <text x="32" y="47" fill="#123B5D" font-size="21" font-weight="700" letter-spacing="0.4">12-GATE EDITORIAL SYSTEM</text>
      <circle cx="355" cy="38" r="4" fill="#E9B44C"/>
      <text x="377" y="47" fill="#123B5D" font-size="21" font-weight="700">8 VENUE PROFILES</text>
      <circle cx="622" cy="38" r="4" fill="#E9B44C"/>
      <text x="644" y="47" fill="#123B5D" font-size="21" font-weight="700">45 TESTS</text>
      <circle cx="788" cy="38" r="4" fill="#E9B44C"/>
      <text x="810" y="47" fill="#123B5D" font-size="21" font-weight="700">4 AUDITORS</text>
    </g>

    <text x="0" y="556" fill="#8DB6C6" font-size="14" letter-spacing="1.3">CNS = CELL · NATURE · SCIENCE — ASPIRATIONAL BENCHMARK; NO AFFILIATION OR ENDORSEMENT</text>
  </g>
</svg>
