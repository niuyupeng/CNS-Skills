name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the manuscript CLI tools
        run: python scripts/cns_audit.py README.md --json /tmp/cns-report.json
      - name: Smoke-test invariants
        run: python scripts/check_invariants.py README.md README.md --strict --json /tmp/invariants.json
      - name: Smoke-test cross-references
        run: python scripts/check_crossrefs.py README.md --strict --json /tmp/crossrefs.json
