name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill discovery metadata
        run: python scripts/check_discovery_metadata.py
      - name: Validate public links, proof counts, corpus, and demo assets
        run: python scripts/check_public_release_assets.py
      - name: Verify generated plugin payload
        run: python scripts/build_plugin_bundle.py --check
      - name: Package the cross-platform plugin
        run: python scripts/package_plugin.py --output-dir /tmp/cns-plugin
      - name: Smoke-test the manuscript CLI tools
        run: python scripts/cns_audit.py README.md --json /tmp/cns-report.json
      - name: Smoke-test the review-citation CLI
        run: python scripts/review_citation_audit.py README.md --json /tmp/review-citations.json
      - name: Smoke-test the review-search CLI
        run: python scripts/review_search_audit.py README.md --json /tmp/review-search.json
      - name: Smoke-test invariants
        run: python scripts/check_invariants.py README.md README.md --strict --json /tmp/invariants.json
      - name: Smoke-test cross-references
        run: python scripts/check_crossrefs.py README.md --strict --json /tmp/crossrefs.json
      - name: Smoke-test the scientific-title audit
        run: python scripts/title_audit.py "Choosing Models for AI-Guided Biomaterials Design" --target nature --article-type review --allow-acronym AI
