<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Predicted and frozen bacterial-signal reduction for six synthetic holdout formulations</title>
  <desc id="desc">Paired blue circles and orange squares compare ridge-model predictions with deterministic synthetic outcomes. H-07 and H-16 have the largest frozen values. No uncertainty is shown because independent replicate data do not exist.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111111">Retrospective holdout comparison</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">SYNTHETIC DEMONSTRATION — NOT EXPERIMENTAL EVIDENCE</text>

  <g stroke="#d6d6d6" stroke-width="1">
    <line x1="90" y1="430" x2="830" y2="430"/>
    <line x1="90" y1="310" x2="830" y2="310"/>
    <line x1="90" y1="190" x2="830" y2="190"/>
    <line x1="90" y1="70" x2="830" y2="70"/>
  </g>
  <g stroke="#222222" stroke-width="1.5">
    <line x1="90" y1="70" x2="90" y2="430"/>
    <line x1="90" y1="430" x2="830" y2="430"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#333333">
    <text x="76" y="435" text-anchor="end">0</text>
    <text x="76" y="315" text-anchor="end">30</text>
    <text x="76" y="195" text-anchor="end">60</text>
    <text x="76" y="75" text-anchor="end">90</text>
    <text x="28" y="250" text-anchor="middle" transform="rotate(-90 28 250)">Bacterial-signal reduction (%)</text>
  </g>

  <g stroke="#777777" stroke-width="1.5">
    <line x1="150" y1="283.6" x2="150" y2="304.8"/>
    <line x1="270" y1="159.6" x2="270" y2="116.4"/>
    <line x1="390" y1="221.2" x2="390" y2="208.4"/>
    <line x1="510" y1="283.2" x2="510" y2="300"/>
    <line x1="630" y1="174.8" x2="630" y2="118"/>
    <line x1="750" y1="322" x2="750" y2="356.4"/>
  </g>
  <g fill="#0072B2" stroke="#004b78" stroke-width="1.2">
    <circle cx="150" cy="283.6" r="6"/>
    <circle cx="270" cy="159.6" r="6"/>
    <circle cx="390" cy="221.2" r="6"/>
    <circle cx="510" cy="283.2" r="6"/>
    <circle cx="630" cy="174.8" r="6"/>
    <circle cx="750" cy="322" r="6"/>
  </g>
  <g fill="#D55E00" stroke="#8b3d00" stroke-width="1.2">
    <rect x="144" y="298.8" width="12" height="12"/>
    <rect x="264" y="110.4" width="12" height="12"/>
    <rect x="384" y="202.4" width="12" height="12"/>
    <rect x="504" y="294" width="12" height="12"/>
    <rect x="624" y="112" width="12" height="12"/>
    <rect x="744" y="350.4" width="12" height="12"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="150" y="458">H-04</text>
    <text x="270" y="458">H-07</text>
    <text x="390" y="458">H-10</text>
    <text x="510" y="458">H-13</text>
    <text x="630" y="458">H-16</text>
    <text x="750" y="458">H-18</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#222222">
    <circle cx="290" cy="495" r="6" fill="#0072B2" stroke="#004b78"/>
    <text x="304" y="500">Model prediction</text>
    <rect x="470" y="489" width="12" height="12" fill="#D55E00" stroke="#8b3d00"/>
    <text x="490" y="500">Frozen synthetic outcome</text>
  </g>
</svg>
